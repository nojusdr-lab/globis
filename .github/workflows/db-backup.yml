# Daily encrypted Supabase backup. The free plan keeps no backups of its own.
# The repo is public and artifacts can be downloaded by anyone signed in to GitHub, so the dump
# (it holds account ids and saved animals) is encrypted with BACKUP_PASSPHRASE before upload.
# Restore: docs/backup-restore.md.
name: Database backup
on:
  schedule:
    # 03:37 UTC, after the daily collect (02:07) has loaded the new rows.
    - cron: '37 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency: db-backup
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - id: ready
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning title=Backup skipped::SUPABASE_DB_URL or BACKUP_PASSPHRASE secret is missing"
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pg_dump matching the server version
        if: steps.ready.outputs.ok == '1'
        run: |
          major=$(psql "$SUPABASE_DB_URL" -Atc 'show server_version_num' | cut -c1-2)
          echo "Server PostgreSQL $major"
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq "postgresql-client-$major" > /dev/null
          echo "/usr/lib/postgresql/$major/bin" >> "$GITHUB_PATH"
      - name: Dump, check, encrypt
        if: steps.ready.outputs.ok == '1'
        run: |
          set -euo pipefail
          mkdir dump
          # App tables (schema and rows) plus account rows, which saved.user_id points to.
          pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges -f dump/public.sql
          pg_dump "$SUPABASE_DB_URL" --data-only --table=auth.users --no-owner --no-privileges -f dump/auth-users.sql
          grep -q 'CREATE TABLE public.saved' dump/public.sql || { echo "::error::dump has no public.saved table"; exit 1; }
          ls -l dump
          name="globis-db-$(date -u +%Y-%m-%d)"
          tar -czf "$name.tar.gz" dump
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase-fd 3 -o "$name.tar.gz.gpg" "$name.tar.gz" 3<<< "$BACKUP_PASSPHRASE"
          rm -rf dump "$name.tar.gz"
          # Prove the file opens with the passphrase before it is stored.
          gpg --batch --pinentry-mode loopback --passphrase-fd 3 -d "$name.tar.gz.gpg" 3<<< "$BACKUP_PASSPHRASE" | tar -tz > /dev/null
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "### Atsarginė kopija: $name ($(du -h "$name.tar.gz.gpg" | cut -f1), užšifruota)" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.ready.outputs.ok == '1'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz.gpg
          retention-days: 14
          if-no-files-found: error
