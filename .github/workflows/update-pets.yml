name: Offline pet data integrity
on:
  pull_request:
    paths:
      - 'App.js'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'supabase/**'
      - 'package*.json'
      - '.github/workflows/update-pets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24', '26']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm test
  expo-export:
    runs-on: ubuntu-latest
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
  postgres-recovery:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: globis_test
          POSTGRES_PASSWORD: globis_test
          POSTGRES_DB: globis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U globis_test -d globis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GLOBIS_TEST_DATABASE_URL: postgres://globis_test:globis_test@127.0.0.1:5432/globis_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16 gnupg
      - run: node --test tests/postgres-recovery.test.cjs
