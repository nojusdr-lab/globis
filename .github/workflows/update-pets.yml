name: Offline pet data integrity
on:
  pull_request:
    paths:
      - 'App.js'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/update-pets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '26']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test tests/*.test.cjs scripts/discovery-engine/*.test.cjs
  expo-export:
    runs-on: ubuntu-latest
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm ci --no-audit --no-fund
      - run: ./node_modules/.bin/expo export --platform all
