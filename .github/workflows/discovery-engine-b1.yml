name: Discovery Engine checks
on:
  pull_request:
    paths:
      - 'scripts/discovery-engine/**'
      - '.github/workflows/discovery-engine-b1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test scripts/discovery-engine/*.test.cjs
      - run: node scripts/discovery-engine/demo.cjs
      - run: node scripts/discovery-engine/file-demo.cjs
