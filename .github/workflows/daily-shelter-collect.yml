# Daily: read every enabled shelter website, rebuild src/data/directPets.json and open a PR with
# the change. No model calls, no secrets. Scraper state (last good snapshot, history) is kept in the
# Actions cache so the publish guard can compare runs. A failed source keeps its previous rows.
name: Daily shelter collect
on:
  schedule:
    # 02:07 UTC = 04:07 Lithuanian winter time, 05:07 summer time. Off the hour: GitHub delays :00 runs.
    - cron: '7 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency: daily-shelter-collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@v4
        with:
          path: data/scraped
          key: scraped-${{ github.run_id }}
          restore-keys: scraped-
      - id: run
        env:
          # Empty until the owner adds the secret; then each run is also loaded into Supabase.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/scrapers/run.cjs data/scraped > scrape.log 2>&1 || { echo "failed=1" >> "$GITHUB_OUTPUT"; tail -20 scrape.log; }
      - name: Warn on empty or unpublished sources
        if: always()
        run: |
          node -e 'const r=require("./data/scraped/report.json");for(const s of r){
            if(s.animals===0)console.log(`::warning title=${s.source}::0 animals (site changed or empty)`);
            else if(!s.published)console.log(`::warning title=${s.source}::not published: ${s.reason||s.state}`);
            if(s.db&&s.db!=="published")console.log(`::warning title=${s.source}::database: ${s.db}`);}' || true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/scraped
          key: scraped-${{ github.run_id }}
      - run: node scripts/scrapers/to-app-data.cjs data/scraped | tee bridge.log
      - name: Summary
        if: always()
        run: |
          { echo '### Rinkimas'; echo '```'; grep '^{"source"' scrape.log || tail -5 scrape.log; echo '```';
            echo '### Programėlės duomenys'; echo '```'; cat bridge.log 2>/dev/null; echo '```';
            echo '### Laukų pilnumas'; node scripts/scrapers/completeness.cjs || true; } >> "$GITHUB_STEP_SUMMARY"
      - name: Database usage
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/scrapers/db-usage.cjs >> "$GITHUB_STEP_SUMMARY"
      - name: Open PR with data change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet src/data/directPets.json && { echo "No data change"; exit 0; }
          b="data/shelter-collect-$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$b"
          git commit -m "data: prieglaudų svetainių atnaujinimas $(date -u +%F)" src/data/directPets.json
          git push -f origin "$b"
          gh pr create --base main --head "$b" --title "Duomenys: prieglaudų svetainės $(date -u +%F)" \
            --body "Automatinis kasdienis rinkimas. Ataskaita: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "PR not created (already open or Actions may not create PRs); branch $b pushed."
      - if: steps.run.outputs.failed == '1'
        run: |
          echo "At least one source failed. See summary."
          exit 1
