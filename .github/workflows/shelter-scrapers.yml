name: Shelter scrapers
on:
  pull_request:
    paths:
      - 'scripts/scrapers/**'
      - 'package*.json'
      - '.github/workflows/shelter-scrapers.yml'
  workflow_dispatch:
    inputs:
      source:
        description: One enabled source ID, after checking its access and content-use conditions
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: node --test scripts/scrapers/tests/*.test.cjs
  preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: scraper-preview-${{ inputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Collect one source and print counts
        shell: bash
        env:
          SOURCE: ${{ inputs.source }}
        run: node scripts/scrapers/preview.cjs "$SOURCE" "$RUNNER_TEMP/scraped-preview" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep full output for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shelter-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/scraped-preview/
          retention-days: 7
          if-no-files-found: warn
